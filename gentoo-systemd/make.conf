# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.

# These warnings indicate likely runtime problems with LTO, so promote them
# to errors. If a package fails to build with these, LTO should not be used there.
WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"

COMMON_FLAGS="-O2 -pipe -march=native -flto ${WARNING_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LDFLAGS}"

RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native -Clinker-plugin-lto"

MAKEOPTS="-j16 -l18"

ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"

GENTOO_MIRRORS="http://distfiles.gentoo.org"

# Appending getbinpkg to the list of values within the FEATURES variable
FEATURES="${FEATURES} getbinpkg"
# Require signatures
FEATURES="${FEATURES} binpkg-request-signature"

# emerge
# EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y --jobs=8 --load-average=10"
EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y"

# use
# NVIDIA GPU support (CUDA/NVENC/Driver)
USE="${USE} cuda nvenc nvidia"

# Compiler toolchain optimizations (LTO/PGO)
USE="${USE} lto pgo"

# Video acceleration APIs (Intel/AMD/Open-Source)
USE="${USE} vaapi vdpau"

# Kernel
USE="${USE} dist-kernel"

# Media framework
USE="${USE} ffmpeg"

ABI_X86="64"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8


