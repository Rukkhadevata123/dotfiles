# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe -march=native"
CFLAGS="${COMMON_FLAGS} -flto=thin"
CXXFLAGS="${COMMON_FLAGS} -flto=thin -stdlib=libstdc++"

LDFLAGS="${LDFLAGS} -fuse-ld=lld"

FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

RUSTFLAGS="${RUSTFLAGS} -C target-cpu=native -Clinker-plugin-lto"

MAKEOPTS="-j16 -l18"

ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"

GENTOO_MIRRORS="http://distfiles.gentoo.org"

# Fallback
# CC="gcc" CXX="g++" LD="ld" AR="ar" NM="nm" RANLIB="ranlib" CFLAGS="-O2 -pipe -march=native" CXXFLAGS="-O2 -pipe -march=native -stdlib=libstdc++" emerge -av moonlight

# Clang
CC="clang"
CXX="clang++"
CPP="clang-cpp" # necessary for xorg-server and possibly other packages
LD="ld.lld"
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"

# Appending getbinpkg to the list of values within the FEATURES variable
FEATURES="${FEATURES} getbinpkg"
# Require signatures
FEATURES="${FEATURES} binpkg-request-signature"

# emerge
# EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y --jobs=8 --load-average=10"
EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y"

# use
# NVIDIA GPU support (CUDA/NVENC/Driver)
USE="${USE} cuda nvenc nvidia"

# Compression algorithms (High-speed/Low-latency)
USE="${USE} lz4 zstd"

# Compiler toolchain optimizations (LLVM/LTO/PGO)
USE="${USE} clang lto pgo"

# Video acceleration APIs (Intel/AMD/Open-Source)
USE="${USE} vaapi vdpau"

# Kernel
USE="${USE} dist-kernel"

# Media framework
USE="${USE} ffmpeg"

# Explicitly disabled flags (Qt5 compatibility)
USE="${USE} -qt5"

ABI_X86="64"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8


