# Default overlay for games launched with MANGOHUD=1.
position=top-left
font_size=22
background_alpha=0.4

# Frame rate and frame time.
fps
frametime
frame_timing

# CPU/GPU load, temperatures, and GPU power.
cpu_stats
cpu_temp
gpu_stats
gpu_temp
gpu_power

# Memory usage and rendering backend.
vram
ram
engine_version

# Right Shift + F12: show/hide. Left Shift + F4: reload config.
toggle_hud=Shift_R+F12
reload_cfg=Shift_L+F4
